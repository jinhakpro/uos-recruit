name: 서울시립대학교 즉시지원 공고 수집

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Scrape 운영 사이트
        run: node scraper/scrape.js
        env:
          JINHAKPRO_BASE: https://www.jinhakpro.com
          JINHAKPRO_OUTPUT: postings.json

      - name: Scrape 알파 사이트
        run: node scraper/scrape.js
        env:
          JINHAKPRO_BASE: https://www-alpha.jinhakpro.com
          JINHAKPRO_OUTPUT: postings.alpha.json

      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/postings.json data/postings.alpha.json
          git diff --cached --quiet || git commit -m "chore: 공고 데이터 갱신 [skip ci]"
          git push
